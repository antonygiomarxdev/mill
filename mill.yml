name: mill
default_target: develop
default_role: sr-dev

models:
  free: "laguna-free"
  paid: "laguna-pro"
  pro: "laguna-ultra"

rate: 0.00001  # dollars per token — set to your provider's rate for cost estimates

targets:
  develop:
    from: "feature/*"
    gates:
      - lint
      - type-check
      - build
    review:
      - tech-lead
    labels:
      start: "stage:dev"
      review: "stage:review"
      land: "stage:qa"
    budget:
      time_seconds: 300
      max_turns: 20
      token_budget: 1000000

  staging:
    from: develop
    gates:
      - lint
      - type-check
      - build
      - diff-coverage
    review:
      - tech-lead
      - reviewer
    labels:
      start: "stage:review"
      review: "stage:staff-review"
      land: "stage:done"
    budget:
      time_seconds: 600
      max_turns: 30
      token_budget: 2000000

  main:
    from: staging
    gates:
      - lint
      - type-check
      - build
      - diff-coverage
      - mutation-testing
      - tech-lead
      - reviewer
      - staff
    confirm: true
    labels:
      start: "stage:staff-review"
      review: null
      land: "stage:done"
    budget:
      time_seconds: 900
      max_turns: 50
      token_budget: 3200000
